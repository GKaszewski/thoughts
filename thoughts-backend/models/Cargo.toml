[package]
name = "models"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "models"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true, features = [
  "sqlx-postgres",
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
validator = { workspace = true, features = ["derive"] }
utoipa = { workspace = true }

common = { path = "../common" }
