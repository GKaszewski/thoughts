[package]
name = "utils"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "utils"
path = "src/lib.rs"

[dependencies]
migration = { path = "../migration" }
uuid = { version = "1.18.1", features = ["v4"] }
sea-orm = { version = "1.1.12", features = ["sqlx-sqlite", "sqlx-postgres"] }

axum = { workspace = true }
tower = { workspace = true, features = ["util"] }


tokio = { workspace = true }
